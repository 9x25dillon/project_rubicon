[/Script/EngineSettings.GameMapsSettings]
; An empty engine map works: ARubiconGameMode spawns the Golgotha greybox when the level has none.
; After running `Rubicon.CreateGolgothaMap` in the editor, point both entries at /Game/Rubicon/Maps/Golgotha.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Rubicon.RubiconGameMode

[/Script/Engine.Engine]
; Fixed-step simulation lives in the narrative core; the engine is free to render as fast as the HMD wants.
bSmoothFrameRate=False

[/Script/Engine.RendererSettings]
; VR baseline: forward shading + MSAA, instanced stereo, mobile multiview for standalone headsets.
r.ForwardShading=True
r.MSAACount=4
r.AntiAliasingMethod=3
vr.InstancedStereo=True
vr.MobileMultiView=True
r.MobileHDR=False
; Physically based exposure: atmosphere keys are in lux; auto-exposure is fixed so the darkness reads as darkness.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkyAtmosphere=True
r.SupportSkyAtmosphere=True

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
bPackageForMetaQuest=True
MinSDKVersion=32
